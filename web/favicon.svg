<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0b0f17"/>
  <!-- Dessin agrandi de 10 % et recentré dans le canvas -->
  <g transform="translate(256 256) scale(1.1) translate(-264.5 -254)">
  <g transform="translate(256 272)">
    <!-- Graduations : de la gauche jusqu'à l'ancienne position de l'aiguille (~42°) -->
    <defs>
      <linearGradient id="jauge" gradientUnits="userSpaceOnUse" x1="-164" y1="0" x2="127" y2="0">
        <stop offset="0" stop-color="#22c55e"/>
        <stop offset="0.5" stop-color="#f59e0b"/>
        <stop offset="1" stop-color="#ef4444"/>
      </linearGradient>
    </defs>
    <path d="M -144 0 A 144 144 0 0 1 106.5 -96.9" fill="none" stroke="url(#jauge)" stroke-width="40" stroke-linecap="round"/>
    <!-- Aiguille verticale -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#f8fafc" stroke-width="32" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="32" fill="#f8fafc"/>
  </g>
  <!-- Sigle € dans le prolongement des graduations, à droite -->
  <g fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-width="18">
    <path d="M 427.4 229.3 A 44 44 0 1 0 427.4 294.7"/>
    <line x1="342" y1="249" x2="414" y2="249" stroke-width="13"/>
    <line x1="342" y1="275" x2="414" y2="275" stroke-width="13"/>
  </g>
  <rect x="112" y="368" width="288" height="32" rx="16" fill="#3b82f6"/>
  </g>
</svg>
